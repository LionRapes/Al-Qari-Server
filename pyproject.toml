[tool.poetry]
name = "app"
version = "1.0.0"
description = "Backend for Al-Qari app - Quran transcription and processing server"
authors = ["Eldar <lopio.lololozka@gmail.com>", "Amir <klaccamirmurtazaev2007@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.34.0,<1.0.0"
boto3 = "^1.43.79"
python-dotenv = "^1.2.3"
ydb = {extras = ["yc"], version = "^3.31.4"}
pydantic = {extras = ["email"], version = "^2.13.5"}
pyjwt = "^2.13.0"
pillow = "^12.3.0"
python-multipart = "^0.0.32"

[tool.poetry.scripts]
dev = "app.main:dev"
prod = "app.main:prod"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
ruff = ">=0.6.0,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"